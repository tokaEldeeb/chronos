version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: chronos-postgres
    environment:
      POSTGRES_DB: chronos
      POSTGRES_USER: chronos
      POSTGRES_PASSWORD: chronos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: chronos-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=chronos
      - PGPASSWORD=chronos
      - PGDATABASE=chronos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3000
      - DB_SYNC=true
    depends_on:
      - postgres
      - redis
    ports:
      - "3000:3000"

  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=chronos
      - PGPASSWORD=chronos
      - PGDATABASE=chronos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SCHEDULER_TICK_CRON=* * * * * *
      - RECLAIM_CRON=* * * * * *
      - SCHEDULE_CRON=* * * * * *
      - DB_SYNC=true
    depends_on:
      - postgres
      - redis

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=chronos
      - PGPASSWORD=chronos
      - PGDATABASE=chronos
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - WORKER_INTERVAL_MS=100
      - VISIBILITY_TIMEOUT_SEC=30
      - DB_SYNC=true
    depends_on:
      - postgres
      - redis
volumes:
  pgdata: {}

